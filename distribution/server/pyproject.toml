[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "agents-memory-collaboration"
version = "2.0.0"
description = "Common Hindsight memory processing, durable sync and project-scoped MCP"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["asyncpg==0.31.0", "mcp==2.3.0", "starlette>=0.47,<2", "uvicorn>=0.35,<1"]

[project.optional-dependencies]
embeddings = ["numpy==2.3.4", "onnxruntime==1.23.2", "tokenizers==0.22.1"]

[project.scripts]
agents-memory-cloud = "agents_memory_collab.cli:main"

[tool.hatch.build]
ignore-vcs = true

[tool.hatch.build.targets.wheel]
packages = ["src/agents_memory_collab"]

[tool.hatch.build.targets.sdist]
include = ["src/**", "pyproject.toml", "README.ko.md", "CONTRACT.md", "requirements.lock", "client-requirements.lock", "uv.lock"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

